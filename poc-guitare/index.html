<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POC guitare : détection de hauteur</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main>
      <h1>POC guitare : détection de hauteur</h1>

      <section aria-labelledby="titre-micro">
        <h2 id="titre-micro">Micro</h2>
        <div class="ligne">
          <button id="btn-demarrer" type="button">Démarrer</button>
          <button id="btn-arreter" type="button" disabled>Arrêter</button>
          <span id="etat-micro">Micro arrêté.</span>
        </div>
        <p id="erreur-micro" class="erreur" role="alert" hidden></p>
        <dl class="infos">
          <dt>Fréquence d'échantillonnage</dt><dd id="info-sample-rate">—</dd>
          <dt>Fenêtre d'analyse</dt><dd id="info-tampon">—</dd>
          <dt>Traitements navigateur</dt><dd id="info-traitements">—</dd>
        </dl>
      </section>

      <section aria-labelledby="titre-reglages">
        <h2 id="titre-reglages">Réglages</h2>
        <div class="grille-reglages">
          <label>Référence A4 (Hz)
            <input id="reglage-a4" type="number" min="430" max="450" step="0.1" value="440" />
          </label>
          <label>Seuil de silence (dBFS)
            <input id="reglage-seuil" type="number" min="-100" max="0" step="1" value="-45" />
          </label>
          <label>Clarté minimale
            <input id="reglage-clarte" type="number" min="0" max="1" step="0.01" value="0.9" />
          </label>
          <label>Lissage
            <select id="reglage-lissage">
              <option value="mediane" selected>Médiane</option>
              <option value="moyenne">Moyenne</option>
            </select>
          </label>
        </div>
        <div class="ligne">
          <button id="btn-calibrer" type="button" disabled>Mesurer le bruit ambiant</button>
          <span id="etat-calibrage"></span>
        </div>
      </section>

      <section aria-labelledby="titre-detection">
        <h2 id="titre-detection">Détection</h2>
        <div class="detection">
          <div id="note-stable" class="note">—</div>
          <div id="statut" class="statut">Micro arrêté</div>
        </div>
        <dl class="mesures">
          <dt>Fréquence</dt><dd id="mesure-frequence">—</dd>
          <dt>Écart</dt><dd id="mesure-cents">—</dd>
          <dt>Clarté</dt><dd id="mesure-clarte">—</dd>
          <dt>Mesure brute</dt><dd id="mesure-brute">—</dd>
          <dt>Dernière latence</dt><dd id="mesure-latence">—</dd>
        </dl>
        <div class="niveau" aria-label="Niveau sonore">
          <div id="niveau-barre" class="niveau-barre"></div>
          <div id="niveau-seuil" class="niveau-seuil" title="Seuil de silence"></div>
        </div>
        <p id="niveau-texte" class="niveau-texte">— dBFS</p>
      </section>

      <section aria-labelledby="titre-historique">
        <h2 id="titre-historique">Dernières notes stables</h2>
        <ol id="historique" class="historique"></ol>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
