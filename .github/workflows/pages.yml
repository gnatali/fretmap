name: Déploiement GitHub Pages

# Publie sur GitHub Pages, à chaque push sur la branche par défaut, l'application (racine du site),
# le POC (sous /poc/) et le POC « Notes qui tombent » (sous /poc-chute/).
# Prérequis (une fois) : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            poc-guitare/package-lock.json
            poc-chute/package-lock.json
      - name: Application
        working-directory: app
        run: |
          npm ci
          npm test
          npm run build
      - name: POC
        working-directory: poc-guitare
        run: |
          npm ci
          npm test
          npm run build
      - name: POC Notes qui tombent
        working-directory: poc-chute
        run: |
          npm ci
          npm test
          npm run build
      - name: Assemblage du site
        run: |
          mkdir -p site
          cp -r app/dist/. site/
          cp -r poc-guitare/dist site/poc
          cp -r poc-chute/dist site/poc-chute
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5
