name: CI

on:
  push:
  pull_request:

jobs:
  poc-guitare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: poc-guitare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: poc-guitare/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
